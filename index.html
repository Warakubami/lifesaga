<style>
:root{--bg:#e4f1d8;--card:#fbfaf1;--ink:#4a3426;--sub:#6f5d49;--line:#cfe3c1;--gold:#a94f14;--goldbg:#ffe9c9;--done:#3f8f4a;--acc:#a94f14;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2b20;--card:#283a2c;--ink:#fdf1de;--sub:#b9c8ab;--line:#3c5340;--gold:#ffb55a;--goldbg:#4a3a22;--done:#8fd48a;--acc:#ffb55a;--accink:#2a1a0c}}
:root[data-theme="dark"]{--bg:#1c2b20;--card:#283a2c;--ink:#fdf1de;--sub:#b9c8ab;--line:#3c5340;--gold:#ffb55a;--goldbg:#4a3a22;--done:#8fd48a;--acc:#ffb55a;--accink:#2a1a0c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;padding-bottom:84px}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.px{font-family:"DotGothic16","Hiragino Sans",monospace;letter-spacing:.02em}
.hero{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px;box-shadow:4px 4px 0 var(--ink)}
.row{display:flex;align-items:center;gap:12px}
.avatar{width:64px;height:64px;border:2px solid var(--ink);border-radius:14px;background:var(--goldbg);display:grid;place-items:center;flex:none}
.lvl{font-size:28px;line-height:1.1}
.ttl{font-size:13px;color:var(--gold);font-weight:700;margin-top:2px}
.bar{height:14px;background:var(--line);border:2px solid var(--ink);border-radius:4px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .5s}
.xpl{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:4px}
.chips{display:flex;gap:8px;margin:14px 0}
.chip{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--sub)}
.chip b{display:block;font-size:20px;color:var(--ink)}
h2{font-size:17px;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center}
.q{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;color:var(--ink);font:inherit;cursor:pointer}
.q .ck{width:28px;height:28px;border:2px solid var(--ink);border-radius:6px;flex:none;display:grid;place-items:center;font-size:18px;color:transparent}
.q.on{background:transparent;border-color:var(--done)}
.q.on .ck{background:var(--done);border-color:var(--done);color:var(--accink)}
.q.on .nm{text-decoration:line-through;color:var(--sub)}
.q .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.q small{display:block;color:var(--sub);font-size:12px}
.xp{font-size:13px;color:var(--gold);font-weight:700;flex:none}
.del{border:0;background:none;font:700 13px inherit;font-family:inherit;color:var(--gold);padding:4px 8px}
.btn{border:2px solid var(--ink);background:var(--acc);color:var(--accink);border-radius:6px;padding:8px 14px;font:700 14px inherit;font-family:inherit;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink)}
.empty{color:var(--sub);text-align:center;padding:24px 0}
.t{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;align-items:center;width:100%;color:var(--ink);font:inherit;text-align:left}
.t .em{flex:none;width:36px;height:36px}
.t.lock{opacity:.75}.t.lock .em{filter:brightness(0);opacity:.2}
.t.eq{border:2px solid var(--gold)}
.t .mini{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.t .mini i{display:block;height:100%;background:var(--acc)}
.t small{color:var(--sub);font-size:12px;display:block}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.sr{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:14px}
.sr .l{width:72px;flex:none}.sr .b{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}.sr .b i{display:block;height:100%;background:var(--acc)}.sr .n{width:40px;text-align:right}
.wk{display:flex;gap:6px;align-items:flex-end;height:80px}
.wk div{flex:1;text-align:center;font-size:11px;color:var(--sub)}.wk i{display:block;background:var(--done);border-radius:3px 3px 0 0;margin-bottom:3px;min-height:3px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--ink);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--sub);padding:10px 0 8px;font:700 12px inherit;font-family:inherit;cursor:pointer}
nav button span{display:block;height:26px;margin-bottom:2px}
nav button.on{color:var(--acc)}
.sheet{position:fixed;inset:0;background:rgba(10,12,40,.55);display:none;align-items:flex-end;z-index:8}
.sheet.show{display:flex}
.sheet form,.sheet .pn{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:2px solid var(--ink);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}

function subFind(i){return ((S.sub||{})[dk()]||[]).filter(function(y){return y.i===i})[0]}
function subTog(i){var x=subFind(i);if(!x)return;x.d=x.d?0:1;sxAdd(x.d?1:-1,x.d?"+1 XP":"取り消しました")}
function subDel(i){var k=dk(),x=subFind(i);if(!x)return;S.sub[k]=S.sub[k].filter(function(y){return y.i!==i});if(x.d)S.sx=Math.max(0,(S.sx||0)-1);save();render()}
function rndTog(){var k=dk();S.rd=S.rd||{};if(S.rd[k]){delete S.rd[k];sxAdd(-1,"取り消しました")}else{S.rd[k]=1;sxAdd(1,"+1 XP")}}

return o}

function toggle(id,fd){

var k=dk(),a=S.log[k]||(S.log[k]=[]),i=a.indexOf(id),before=lv(stats().xp).l,q=qOf(id);

a.push(id);
var act2=actv();
var all=act2.every(function(x){return a.indexOf(x.id)>=0});
var msgs=["+"+q.x+" XP"];
if(all&&S.perfect.indexOf(k)<0){S.perfect.push(k);msgs=["全クエスト制覇！"]}
var s=ctx(),after=s.lv,cls="";
if(after>before){msgs=["LEVEL UP！ Lv."+after];cls="lv"}
T.forEach(function(t){if(!S.earned[t.id]&&t.v(s)>=t.g){S.earned[t.id]=k;msgs=["称号獲得「"+t.n+"」"];cls="lv";if(!S.eq)S.eq=t.id}});
save();render();toast(msgs[0],cls)}
function avatar(l){return l>=10?"👑":l>=7?"🛡️":l>=4?"⚔️":l>=2?"🗡️":"🥚"}

document.getElementById("nav").style.display="flex";
var s=ctx(),L=lv(s.xp),k=dk(),done=S.log[k]||[],act=actv();
var eq=T.filter(function(t){return t.id===S.eq})[0];
var h=ubar()+warnBar();
if(tab==="q"){
var n=act.filter(function(q){return done.indexOf(q.id)>=0}).length;
h+=dayBar()+'<div class="hero"><div class="row"><div class="avatar">'+spr(av(L.l),52)+'</div><div><div class="lvl px">Lv.'+L.l+'</div><div class="ttl">'+(eq?spr(TK[eq.id],16)+" "+esc(eq.n):"称号なし")+'</div></div></div>'+
'<div class="bar"><i style="width:'+(L.cur/L.need*100)+'%"></i></div><div class="xpl"><span>XP '+L.cur+' / '+L.need+'</span><span>次のレベルまで '+(L.need-L.cur)+'</span></div></div>'+
'<div class="chips"><div class="chip"><b>'+spr("fox",20)+' '+s.cur+'日</b>連続クリア</div><div class="chip"><b>'+n+' / '+act.length+'</b>今日のクリア</div></div>'+
'<h2 class="px">今日のクエスト<span><button class="btn ghost" id="ed">'+(edit?"完了":"編集")+'</button> <button class="btn" id="ad">＋ 追加</button></span></h2>';
if(!act.length)h+='<div class="empty">クエストがありません。「＋ 追加」から作りましょう。</div>';
S.q.filter(function(q){return !q.del}).forEach(function(q){var on=done.indexOf(q.id)>=0,rs=q.core&&S.rest[k];
h+='<div class="q'+(on?" on":"")+(rs?" rs":"")+'" '+(edit||rs?"":'data-t="'+q.id+'" role="button" tabindex="0"')+'><span class="ck">✓</span><span class="nm">'+esc(q.n)+'<small>'+spr(C[q.c].k,16)+C[q.c].n+'</small></span><span class="xp">'+(rs?"お休み中":q.x+"XP")+'</span>'+(edit&&!q.core?'<button class="del" data-d="'+q.id+'" aria-label="削除">削除</button>':"")+'</div>'});
if(n===act.length&&act.length)h+='<div class="empty">'+spr("chick",32)+'<br>今日のクエストを全てクリアしました！</div>';h+=subHtml()}
if(tab==="t"){
var got=Object.keys(S.earned).length;
h+='<h2 class="px">称号<span style="font-size:13px;color:var(--sub)">'+got+' / '+T.length+'</span></h2><p style="color:var(--sub);font-size:13px;margin:0 0 10px">獲得した称号をタップすると装備できます。</p>';
T.forEach(function(t){var v=Math.min(t.v(s),t.g),ok=!!S.earned[t.id];
h+='<button class="t'+(ok?"":" lock")+(S.eq===t.id?" eq":"")+'" '+(ok?'data-e="'+t.id+'"':"disabled")+'><span class="em">'+spr(TK[t.id],36)+'</span><span style="flex:1"><b>'+(ok?esc(t.n):"？？？")+'</b><small>'+t.d+'</small>'+(ok?"":'<div class="mini"><i style="width:'+(v/t.g*100)+'%"></i></div><small>'+v+' / '+t.g+'</small>')+'</span></button>'})}
if(tab==="d"){
h+='<h2 class="px">冒険の書<span style="font-size:13px;color:var(--sub)">'+S.diary.length+'件</span></h2><p style="color:var(--sub);font-size:13px;margin:0 0 10px">★をつけた日記はずっと残ります。★なしは最新100件までです。</p>';
if(!S.diary.length)h+='<div class="empty">'+spr("rabbit",32)+'<br>まだ記録がありません。クエストから今日の幸せを記しましょう。</div>';
S.diary.forEach(function(e){var p=e.d.split("-"),dt=new Date(+p[0],+p[1]-1,+p[2]),yr=p[0]!==String(new Date().getFullYear())?p[0]+"年":"";
h+='<div class="di"><div class="dh"><span class="px">'+yr+(+p[1])+'月'+(+p[2])+'日（'+"日月火水木金土".charAt(dt.getDay())+'）</span><button class="star'+(e.s?" on":"")+'" data-s="'+e.d+'" aria-label="お気に入り" aria-pressed="'+(!!e.s)+'">'+(e.s?"★":"☆")+'</button></div><p>'+esc(e.t)+'</p></div>'})}
if(tab==="s"){

Object.keys(C).forEach(function(c){h+='<div class="sr"><span class="l">'+spr(C[c].k,16)+' '+C[c].n+'</span><span class="b"><i style="width:'+(s.cat[c]/mx*100)+'%"></i></span><span class="n">'+s.cat[c]+'</span></div>'});
h+='</div><h2 class="px">この7日間</h2><div class="st"><div class="wk">';

w.forEach(function(x){h+='<div><i style="height:'+(x[0]/wm*56)+'px"></i>'+x[1]+'</div>'});

document.getElementById("app").innerHTML=h;

document.getElementById("nav").innerHTML=nav.concat([["d","","日記"]]).map(function(x){return'<button data-n="'+x[0]+'" class="'+(tab===x[0]?"on":"")+'"><span>'+spr({q:"fox",t:"chick",s:"owl",d:"rabbit"}[x[0]],24)+'</span>'+x[2]+'</button>'}).join("")}
document.addEventListener("click",function(e){
var t=e.target.closest("[data-t]"),d=e.target.closest("[data-d]"),n=e.target.closest("[data-n]"),q=e.target.closest("[data-e]");
